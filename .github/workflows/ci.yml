name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Skip online cert-revocation checks during NuGet restore. Author-signed
      # packages fail NU3012 the moment an author's signing cert is revoked
      # even though the package itself is unchanged and trusted (Refit 10.1.6,
      # 2026-07: cert 'CN=Glenn Watson' revoked mid-life). Offline mode still
      # validates the signature and chain, just doesn't call OCSP/CRL.
      NUGET_CERT_REVOCATION_MODE: offline
    steps:
      - uses: actions/checkout@v4
        with:
          # Phase E: pull external/polygon-net-client submodule (pinned at
          # 0.10.0 / 614a273) so the SDK projects referenced by the
          # service csproj resolve at restore time.
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HistoryService.slnx

      - name: Build
        run: dotnet build HistoryService.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HistoryService.slnx --configuration Release --no-build --verbosity normal
