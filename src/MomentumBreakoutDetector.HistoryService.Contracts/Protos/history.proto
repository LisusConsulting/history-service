syntax = "proto3";

package mbd.history.v1;

option csharp_namespace = "MomentumBreakoutDetector.HistoryService.Contracts.V1";

import "google/protobuf/timestamp.proto";

// ============================================================================
// HistoryService — single source of historical market data for MBD.
//
// Phase 1 contract. Consumers (backtest engine, live engine NBBO at order
// time, AI service eventually) call this service instead of hitting Polygon
// / FRED directly. The service owns:
//   - bars (stock minute/day OHLCV)
//   - NBBO option quotes (point-in-time bid/ask + sizes)
//   - option chains (per as-of-date contract universe)
//   - macro observations (FRED series)
//   - miss markers (negative-result cache for cold-start determinism)
//
// Concurrency contract: every endpoint is single-flight by key —
// concurrent identical requests coalesce to one upstream fetch.
//
// Backtest contract: consumers call EnsureRangeCached up-front (server
// streams progress) before issuing point fetches. This is the batched
// path. Point fetches still work mid-run for the live engine NBBO at
// order time.
//
// Auth: TODO Phase 2 — M2M client_credentials against
// https://sts.motuzko.com (scope: mbd-history). MVP is unauthenticated.
// ============================================================================
service HistoryService {
  // ---- Point fetches (cache-first; on miss → upstream fetch + write-through).
  rpc GetBars (GetBarsRequest) returns (GetBarsResponse);
  rpc GetNbbo (GetNbboRequest) returns (GetNbboResponse);
  rpc GetOptionChain (GetOptionChainRequest) returns (GetOptionChainResponse);
  rpc GetMacro (GetMacroRequest) returns (GetMacroResponse);

  // ---- Warmup. Server-streaming progress. Identifies missing keys for
  // the requested range, batches upstream fetches, returns when the cache
  // covers the full range. Idempotent: a second call on a fully-cached
  // range completes in one progress event with status COMPLETED and zero
  // upstream calls.
  rpc EnsureRangeCached (EnsureRangeCachedRequest) returns (stream EnsureRangeCachedProgress);

  // ---- Operability.
  rpc GetCacheStats (GetCacheStatsRequest) returns (GetCacheStatsResponse);

  // ---- Daily options-flow read (PR 1, daily_options_flow surface).
  // Past-only: rejects today-or-later via PastOnlyRangeValidator. The live
  // engine never reads this table — it computes flow on-the-fly per signal
  // cycle from the current chain. Backtests read past-day rows here.
  rpc GetDailyOptionsFlow (GetDailyOptionsFlowRequest) returns (GetDailyOptionsFlowResponse);

  // ---- Daily ATM-IV read (Wave B / PR 5 of the ATM-IV plan).
  // Past-only: rejects today-or-later. Aggregated ATM IV across the
  // ATM±5% × 0-60 DTE band per (underlying, trade_date), populated by
  // PR 6 (Wave C) daily 08:00 ET cron and the Wave C/D backfill seeder
  // mode --surface daily_atm_iv. Read-only here; no upstream fetch on
  // miss (consumers run the seeder/cron first to populate a window).
  rpc GetDailyAtmIv (GetDailyAtmIvRequest) returns (GetDailyAtmIvResponse);

  // ---- Intraday ATM-IV write + read (HWZ-36 / Phase B IV-parity).
  //
  // Captured by the LIVE engine's SignalSourcesService on every ~5-min
  // OptionsAnalysisService refresh (RecordIntradayAtmIv). Backtests of
  // recent days read it back via ListIntradayAtmIv (range pre-load) or
  // GetIntradayAtmIvAtOrBefore (per-bar lookup) so replays consult the
  // same intraday IV reading the live engine saw — closes the live↔
  // backtest IV parity gap exposed on 2026-05-26 (TSLA crossed the 0.45
  // High threshold intraday while N-1 daily close stayed Normal).
  //
  // NOT past-only. The whole point is that the live engine writes
  // today's captures and backtests of today re-read them. Past-only
  // would break the surface. The read path enforces no-lookahead
  // implicitly via the at-or-before semantic — callers can never see a
  // row stamped AFTER the timestamp they asked about.
  rpc RecordIntradayAtmIv (RecordIntradayAtmIvRequest) returns (RecordIntradayAtmIvResponse);
  rpc GetIntradayAtmIvAtOrBefore (GetIntradayAtmIvAtOrBeforeRequest) returns (GetIntradayAtmIvAtOrBeforeResponse);
  rpc ListIntradayAtmIv (ListIntradayAtmIvRequest) returns (ListIntradayAtmIvResponse);
}

// ----------------------------------------------------------------------------
// Shared message types.
// ----------------------------------------------------------------------------

enum BarTimeframe {
  BAR_TIMEFRAME_UNSPECIFIED = 0;
  BAR_TIMEFRAME_MINUTE = 1;
  BAR_TIMEFRAME_FIVE_MINUTE = 2;
  BAR_TIMEFRAME_DAY = 3;
}

enum ContractType {
  CONTRACT_TYPE_UNSPECIFIED = 0;
  CONTRACT_TYPE_CALL = 1;
  CONTRACT_TYPE_PUT = 2;
}

message Bar {
  string symbol = 1;
  google.protobuf.Timestamp timestamp = 2;
  double open = 3;
  double high = 4;
  double low = 5;
  double close = 6;
  double volume = 7;
  double vwap = 8;
  int32 trade_count = 9;
}

message NbboQuote {
  string ticker = 1;                                  // O:TSLA241220C00250000
  google.protobuf.Timestamp requested_ts = 2;         // ts the caller asked about
  google.protobuf.Timestamp as_of_ts = 3;             // SIP timestamp the quote was published at
  double bid_price = 4;
  double ask_price = 5;
  int32 bid_size = 6;
  int32 ask_size = 7;
  int32 bid_exchange = 8;
  int32 ask_exchange = 9;
  double underlying_price = 10;                       // sanity field — underlying close at the same minute
}

message OptionContract {
  string ticker = 1;
  string underlying_ticker = 2;
  ContractType contract_type = 3;
  string exercise_style = 4;                          // american | european
  google.protobuf.Timestamp expiration_date = 5;
  double strike_price = 6;
  int32 shares_per_contract = 7;
  string primary_exchange = 8;
}

message MacroObservation {
  string series_id = 1;                               // VIXCLS, DGS10, etc.
  google.protobuf.Timestamp observation_date = 2;
  double value = 3;
}

// ----------------------------------------------------------------------------
// GetBars — point fetch over a [from_ts, to_ts] range for one (symbol, timeframe).
// ----------------------------------------------------------------------------
message GetBarsRequest {
  string symbol = 1;
  BarTimeframe timeframe = 2;
  google.protobuf.Timestamp from_ts = 3;
  google.protobuf.Timestamp to_ts = 4;
}

message GetBarsResponse {
  repeated Bar bars = 1;
  bool cache_hit = 2;                                 // true iff zero upstream calls for this range
}

// ----------------------------------------------------------------------------
// GetNbbo — point-in-time NBBO for one option contract at one timestamp.
// ----------------------------------------------------------------------------
message GetNbboRequest {
  string ticker = 1;                                  // O:-prefixed
  google.protobuf.Timestamp ts = 2;
}

message GetNbboResponse {
  // Set iff a quote exists. Absent (null in C#) means a miss-marker is
  // recorded for this (ticker, ts) — caller should NOT retry.
  NbboQuote quote = 1;
  bool cache_hit = 2;
  bool is_miss_marker = 3;                            // true iff a recorded miss matched
}

// ----------------------------------------------------------------------------
// GetOptionChain — contract universe for one (underlying, as_of_date).
// ----------------------------------------------------------------------------
message GetOptionChainRequest {
  string underlying_ticker = 1;
  google.protobuf.Timestamp as_of_date = 2;           // date — time component ignored

  // Optional filters; empty / 0 = no filter.
  ContractType contract_type = 3;
  google.protobuf.Timestamp expiration_after = 4;
  google.protobuf.Timestamp expiration_before = 5;
  double strike_min = 6;
  double strike_max = 7;
}

message GetOptionChainResponse {
  repeated OptionContract contracts = 1;
  bool cache_hit = 2;
  bool is_miss_marker = 3;
}

// ----------------------------------------------------------------------------
// GetMacro — FRED observations for one series over a date range.
// ----------------------------------------------------------------------------
message GetMacroRequest {
  string series_id = 1;
  google.protobuf.Timestamp from_date = 2;
  google.protobuf.Timestamp to_date = 3;
}

message GetMacroResponse {
  repeated MacroObservation observations = 1;
  bool cache_hit = 2;
}

// ----------------------------------------------------------------------------
// EnsureRangeCached — warmup. Server-streaming progress.
// Caller picks one or more data classes; service identifies gaps, fans out
// batched upstream fetches, and streams progress until done.
// ----------------------------------------------------------------------------
enum DataClass {
  DATA_CLASS_UNSPECIFIED = 0;
  DATA_CLASS_BARS = 1;
  DATA_CLASS_NBBO = 2;
  DATA_CLASS_CHAINS = 3;
  DATA_CLASS_MACRO = 4;
}

enum WarmupStatus {
  WARMUP_STATUS_UNSPECIFIED = 0;
  WARMUP_STATUS_PLANNING = 1;                         // gap-detection in progress
  WARMUP_STATUS_FETCHING = 2;                         // batched upstream calls in flight
  WARMUP_STATUS_COMPLETED = 3;                        // cache covers requested range
  WARMUP_STATUS_FAILED = 4;                           // unrecoverable upstream failure
}

message EnsureRangeCachedRequest {
  // Symbols / tickers / series ids the caller wants warmed.
  repeated string symbols = 1;
  // Which data classes to warm. Multiple classes share one warmup task so
  // a backtest can issue one EnsureRangeCached for everything it needs.
  repeated DataClass data_classes = 2;
  google.protobuf.Timestamp from_ts = 3;
  google.protobuf.Timestamp to_ts = 4;

  // Per-class hints. Optional.
  BarTimeframe bar_timeframe = 5;
}

message EnsureRangeCachedProgress {
  WarmupStatus status = 1;
  int32 keys_total = 2;                               // total minute keys / dates expected to cover
  int32 keys_complete = 3;                            // keys present in cache (hit) or just fetched
  int32 keys_missing = 4;                             // keys still pending fetch
  int32 upstream_calls = 5;                           // batched upstream calls issued so far
  string message = 6;                                 // human-readable status, optional
  // Which data class this progress event belongs to. Each requested class
  // emits at least one terminal event with status=COMPLETED|FAILED. The
  // server may emit interim FETCHING events on long-running classes
  // (e.g. CHAINS sweeping many trading days).
  DataClass data_class = 7;
  int64 elapsed_ms = 8;                               // ms since the warmup orchestrator started
}

// ----------------------------------------------------------------------------
// Cache stats — operational metrics.
// ----------------------------------------------------------------------------
message GetCacheStatsRequest {
  // Optional class filter; empty = aggregate across all.
  DataClass data_class = 1;
}

message ClassStats {
  DataClass data_class = 1;
  int64 total_requests = 2;
  int64 cache_hits = 3;
  int64 upstream_fetches = 4;
  int64 miss_markers = 5;
  int32 in_flight_count = 6;
  double latency_p50_ms = 7;
  double latency_p95_ms = 8;
  double latency_p99_ms = 9;
}

message GetCacheStatsResponse {
  repeated ClassStats class_stats = 1;
  google.protobuf.Timestamp as_of = 2;
}

// ----------------------------------------------------------------------------
// GetDailyOptionsFlow — read aggregated put/call flow rows over [from, to].
//
// Server applies PastOnlyRangeValidator and returns NotFound-style empty
// payload (rows: []) when the range has no rows. There is no upstream
// fetch on miss — this surface is populated exclusively by the backfill
// seeder + daily 08:00 ET cron in history-service. Consumers who need a
// guaranteed-populated date range should run those tools first.
// ----------------------------------------------------------------------------
message GetDailyOptionsFlowRequest {
  string underlying_ticker = 1;
  google.protobuf.Timestamp from_date = 2;       // date — time component ignored
  google.protobuf.Timestamp to_date = 3;         // date — time component ignored, inclusive
}

message DailyOptionsFlowRow {
  string underlying_ticker = 1;
  google.protobuf.Timestamp trade_date = 2;      // date — UTC midnight
  int64 call_volume = 3;
  int64 put_volume = 4;
  int64 call_oi = 5;
  int64 put_oi = 6;
  // put_call_ratio / flow_score may be unset in the source row when
  // call_side <= 0; absent here means SQL NULL (consumer should treat
  // as "no flow signal for this day"). Booleans flag the absence
  // explicitly so the wire payload doesn't conflate 0.0 with NULL.
  double put_call_ratio = 7;
  bool put_call_ratio_is_null = 8;
  double flow_score = 9;
  bool flow_score_is_null = 10;
  int32 contract_count = 11;
}

message GetDailyOptionsFlowResponse {
  repeated DailyOptionsFlowRow rows = 1;
  bool cache_hit = 2;                            // always true — no upstream on miss
}

// ----------------------------------------------------------------------------
// GetDailyAtmIv — read aggregated ATM-IV rows over [from, to] for one
// underlying. Past-only guard rejects today-or-later (the live engine
// computes today's IV on-the-fly from the current snapshot/chain). No
// upstream fetch on miss — populated exclusively by the Wave C / PR 6
// daily 08:00 ET cron and the Wave C/D backfill seeder mode
// --surface daily_atm_iv.
// ----------------------------------------------------------------------------
message GetDailyAtmIvRequest {
  string underlying_ticker = 1;
  google.protobuf.Timestamp from_date = 2;       // date — time component ignored
  google.protobuf.Timestamp to_date = 3;         // date — time component ignored, inclusive
}

message DailyAtmIvRow {
  string underlying_ticker = 1;
  google.protobuf.Timestamp trade_date = 2;      // date — UTC midnight
  // atm_iv may be unset in the source row when the aggregate had zero
  // valid contracts (all NULL IV after solver failures). The boolean
  // flag distinguishes "0.0 known" from "NULL — no flow signal" so the
  // wire payload doesn't conflate them.
  double atm_iv = 3;
  bool atm_iv_is_null = 4;
  // contract_count = how many distinct ATM-band contracts contributed
  // to the day's aggregate. Useful for sanity-checking sparse-data
  // days. May be NULL when atm_iv is NULL (e.g. on a marker-only day).
  int32 contract_count = 5;
  bool contract_count_is_null = 6;
}

message GetDailyAtmIvResponse {
  repeated DailyAtmIvRow rows = 1;
  bool cache_hit = 2;                            // always true — no upstream on miss
}

// ----------------------------------------------------------------------------
// Intraday ATM-IV (HWZ-36).
//
// Schema mirrors history-service's intraday_atm_iv table (migration 016):
// (underlying_ticker, captured_at, atm_iv, contract_count). PRIMARY KEY
// (underlying_ticker, captured_at), so re-records at the same minute
// upsert in place.
//
// Read pattern: backtests call ListIntradayAtmIv once per run to pre-load
// the window, then evaluate per bar with a client-side at-or-before
// binary search (O(log n) per bar, vs N round-trips to the server).
// GetIntradayAtmIvAtOrBefore exists for ad-hoc/diagnostic callers.
// ----------------------------------------------------------------------------
message RecordIntradayAtmIvRequest {
  string underlying_ticker = 1;
  google.protobuf.Timestamp captured_at = 2;     // UTC capture time from the live engine
  double atm_iv = 3;                             // raw avg ATM IV (NOT regime label)
  int32 contract_count = 4;                      // contracts that contributed to the avg
}

message RecordIntradayAtmIvResponse {
  // True iff a brand-new row was inserted; false means an existing row
  // at the same (underlying, captured_at) was upserted. Either way the
  // post-condition is that the row reflects the request values.
  bool inserted = 1;
}

message GetIntradayAtmIvAtOrBeforeRequest {
  string underlying_ticker = 1;
  google.protobuf.Timestamp at_or_before_utc = 2;
}

message IntradayAtmIvRow {
  string underlying_ticker = 1;
  google.protobuf.Timestamp captured_at = 2;
  double atm_iv = 3;
  int32 contract_count = 4;
}

message GetIntradayAtmIvAtOrBeforeResponse {
  // Set iff a row exists with captured_at <= at_or_before_utc for the
  // requested underlying. Absent means "no row yet" — caller should
  // fall through to the daily ATM-IV lookup.
  bool found = 1;
  IntradayAtmIvRow row = 2;
}

message ListIntradayAtmIvRequest {
  string underlying_ticker = 1;
  google.protobuf.Timestamp from_utc = 2;        // inclusive
  google.protobuf.Timestamp to_utc = 3;          // inclusive
}

message ListIntradayAtmIvResponse {
  // Rows sorted ascending by captured_at. Empty when no rows exist —
  // caller falls through to daily ATM-IV / Bollinger proxy.
  repeated IntradayAtmIvRow rows = 1;
}
